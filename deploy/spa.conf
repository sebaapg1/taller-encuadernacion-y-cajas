# Configuración de nginx para Taller (copia versionada; el servidor la lee desde /opt/stacks/taller/spa.conf).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html: nunca cachear, para que cada entrega llegue al tiro.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Archivos con hash en el nombre (Vite): cachear un año, son inmutables.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Iconos y estáticos sin hash: cachear un día y forzar con ?v= al cambiarlos.
    location ~* \.(svg|png|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Rutas de la app (SPA): todo lo demás vuelve a index.html.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
